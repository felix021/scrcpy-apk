apply plugin: 'com.android.application'

android {
    namespace 'cn.ohmyterm.scrcpy'
    compileSdkVersion 36
    buildFeatures { buildConfig true }
    testBuildType providers.gradleProperty('scrcpyTestBuildType').getOrElse('debug')
    ndkVersion '28.0.13004108'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' } }
    defaultConfig {
        applicationId 'cn.ohmyterm.scrcpy'
        testInstrumentationRunner 'cn.ohmyterm.scrcpy.WirelessPairingTest'
        minSdkVersion 26
        targetSdkVersion 36
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static'; cppFlags '-std=c++17' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }
        versionCode 18
        versionName '1.2.0'
    }
    signingConfigs {
        play {
            def path = System.getenv('SCRCPY_PLAY_KEYSTORE')
            storeFile path ? file(path) : null
            storePassword System.getenv('SCRCPY_PLAY_STORE_PASSWORD')
            keyAlias System.getenv('SCRCPY_PLAY_KEY_ALIAS')
            keyPassword System.getenv('SCRCPY_PLAY_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            // Retain the existing signing identity; this is not a store signing key.
            signingConfig signingConfigs.debug
        }
        play {
            initWith release
            signingConfig signingConfigs.play
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.main.assets.srcDir "$buildDir/generated/server"
}

task prepareServer(type: Exec) {
    inputs.file '../scripts/prepare-server.sh'
    outputs.file "$buildDir/generated/server/scrcpy-server.jar"
    commandLine 'bash', '../scripts/prepare-server.sh', "$buildDir/generated/server"
}
preBuild.dependsOn prepareServer

task prepareCrypto(type: Exec) {
    inputs.files '../scripts/prepare-crypto.py', '../scripts/build-crypto.sh'
    outputs.dir '../build/boringssl'
    commandLine 'bash', '../scripts/build-crypto.sh'
}
preBuild.dependsOn prepareCrypto
tasks.configureEach { if (name.startsWith('configureCMake') || name.startsWith('generateJsonModel')) dependsOn prepareCrypto }
tasks.register('validatePlaySigning') {
    doLast {
        ['SCRCPY_PLAY_KEYSTORE', 'SCRCPY_PLAY_STORE_PASSWORD', 'SCRCPY_PLAY_KEY_ALIAS', 'SCRCPY_PLAY_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Missing ${it}; Play builds require a dedicated upload key.")
        }
    }
}
tasks.configureEach { if (name == 'prePlayBuild') dependsOn 'validatePlaySigning' }

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
